[config]

    reload_apps = false

[templates.waybar]

    input_path = '~/.config/matugen/templates/waybar.css'
    output_path = '~/.config/waybar/styling/colors.css'
    post_hook = "pkill -SIGUSR2 waybar"

[templates.rofi]
    
    input_path = '~/.config/matugen/templates/rofi.rasi'
    output_path = '~/.config/rofi/themes/colors/colors.rasi'

[templates.kitty]
    input_path = '~/.config/matugen/templates/kitty.conf'
    output_path = '~/.config/kitty/kitty-colors.conf'
