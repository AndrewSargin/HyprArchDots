[config]

    reload_apps = false

[templates.waybar]

    input_path = '~/.config/matugen/templates/waybar.css'
    output_path = '~/.config/waybar/styling/colors.css'
    post_hook = "pkill -SIGUSR2 waybar"

[templates.rofi]
    
    input_path = '~/.config/matugen/templates/rofi.rasi'
    output_path = '~/.config/rofi/themes/colors/colors.rasi'

[templates.kitty]
    input_path = '~/.config/matugen/templates/kitty.conf'
    output_path = '~/.config/kitty/kitty-colors.conf'

[templates.fcitx5]
    input_path = '~/.config/matugen/templates/fcitx5.conf'
    output_path = '~/.local/share/fcitx5/themes/Andsar/theme.conf'

[templates.gtk3]
    input_path = '~/.config/matugen/templates/gtk.css'
    output_path = '~/.config/gtk-3.0/gtk-colors.css'
    post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
    input_path = '~/.config/matugen/templates/gtk.css'
    output_path = '~/.config/gtk-4.0/gtk-colors.css'
    post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'

[templates.hyprland]
    input_path = '~/.config/matugen/templates/hyprland.lua'
    output_path = '~/.config/hypr/colors.lua'
